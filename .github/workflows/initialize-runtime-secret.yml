name: Initialize Beat runtime secret

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: beat-runtime-secret-initialize-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BEAT_RUNTIME_SECRET_ARN: ${{ vars.BEAT_RUNTIME_SECRET_ARN }}
      BEAT_AUTH_ISSUER_URL: ${{ vars.BEAT_AUTH_ISSUER_URL }}
      BEAT_AUTH_AUDIENCE: ${{ vars.BEAT_AUTH_AUDIENCE }}
      BEAT_GITHUB_CONTENT_REPOSITORY: ${{ vars.BEAT_GITHUB_CONTENT_REPOSITORY }}
      BEAT_GITHUB_APP_ID: ${{ secrets.BEAT_GITHUB_APP_ID }}
      BEAT_GITHUB_APP_INSTALLATION_ID: ${{ secrets.BEAT_GITHUB_APP_INSTALLATION_ID }}
      BEAT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.BEAT_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assume the bootstrap role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["secretsmanager:DescribeSecret","secretsmanager:PutSecretValue"],"Resource":"${{ vars.BEAT_RUNTIME_SECRET_ARN }}"}]}
      - name: Initialize the empty runtime secret once
        run: node scripts/initialize-runtime-secret.mjs

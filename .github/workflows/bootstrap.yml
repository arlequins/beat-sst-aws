name: Bootstrap AWS account

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Review or apply the production bootstrap
        required: true
        type: choice
        options: [diff, deploy]

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: beat-aws-bootstrap-production
      cancel-in-progress: false
    env:
      ACKNOWLEDGE_ACCOUNT_BASELINE: "true"
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BEAT_OWNER: ${{ secrets.BEAT_OWNER }}
      BEAT_RUNTIME_SECRET_NAME: ${{ secrets.BEAT_RUNTIME_SECRET_NAME }}
      BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
      MONTHLY_BUDGET_USD: ${{ secrets.MONTHLY_BUDGET_USD }}
      ENABLE_AUDIT_TRAIL: ${{ secrets.ENABLE_AUDIT_TRAIL }}
      AWS_OIDC_PROVIDER_ARN: ${{ secrets.AWS_OIDC_PROVIDER_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assume the bootstrap role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Resolve the AWS-managed Cost Anomaly monitor
        run: |
          monitor_arn="$(aws ce get-anomaly-monitors --query 'AnomalyMonitors[?MonitorType==`DIMENSIONAL` && MonitorDimension==`SERVICE`].MonitorArn | [0]' --output text)"
          test -n "$monitor_arn" && test "$monitor_arn" != "None"
          echo "COST_ANOMALY_MONITOR_ARN=$monitor_arn" >> "$GITHUB_ENV"
      - name: Review planned changes
        if: inputs.operation == 'diff'
        run: pnpm exec sst diff --stage production
      - name: Apply reviewed changes
        if: inputs.operation == 'deploy'
        run: pnpm exec sst deploy --stage production

name: Update Beat Google runtime secret

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: beat-runtime-secret-update-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BEAT_RUNTIME_SECRET_ARN: ${{ vars.BEAT_RUNTIME_SECRET_ARN }}
      BEAT_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.BEAT_AUTH_GOOGLE_CLIENT_ID }}
      BEAT_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.BEAT_AUTH_GOOGLE_CLIENT_SECRET }}
      BEAT_AUTH_GOOGLE_REDIRECT_URI: ${{ secrets.BEAT_AUTH_GOOGLE_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4
      - name: Assume the bootstrap role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["secretsmanager:DescribeSecret","secretsmanager:GetSecretValue","secretsmanager:PutSecretValue"],"Resource":"${{ vars.BEAT_RUNTIME_SECRET_ARN }}"}]}
      - name: Merge Google OAuth values into the runtime secret
        run: node scripts/update-runtime-secret.mjs
